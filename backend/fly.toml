# =============================================================================
# fly.toml — AMBER backend
#
# Single machine in sin (Singapore) — co-located with Upstash Redis (ap-southeast-1)
# and near Supabase Postgres (Seoul, ap-northeast-2). See docs/DEPLOY.md.
# =============================================================================

app = "amber"
primary_region = "sin"
kill_signal = "SIGTERM"
kill_timeout = "10s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  APP_PORT = "3700"

[http_service]
  internal_port = 3700
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 150

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
