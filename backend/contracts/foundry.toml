[profile.default]
src = "."
out = "out"
libs = ["lib"]
script = "script"
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "cancun"

[rpc_endpoints]
xlayer = "${XLAYER_RPC}"
xlayer_testnet = "https://testrpc.xlayer.tech"

[etherscan]
# OKLink is X Layer's block explorer. Contract verification uses their API.
xlayer = { key = "${OKLINK_API_KEY}", url = "https://www.oklink.com/api/v5/explorer/xlayer/api", chain = 196 }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
